name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Start from nothing so the workflow states its own token contract rather than
# inheriting whatever the repository default happens to be. Jobs opt in below.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.5' }
      - name: Verify concurrent composite Go bootstrap
        run: bash scripts/test-action-bootstrap
      - run: go vet ./...
      - run: go build -ldflags "-s -w" -o supplychain ./
      - run: go test ./... -race -count=1
      - name: Enforce pinned release toolchain
        run: python3 scripts/check_release_security.py
      - name: Test IOC refresh logic
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Enforce security-critical coverage floors
        run: python3 scripts/check_go_coverage.py
      - name: Build clean fixture image
        run: docker build --tag supplychain-fixture:ci testdata/image
      - name: Exercise the composite action and image scanner
        uses: ./
        with:
          path: .
          policy: strict
          image: supplychain-fixture:ci
          fail-on-severity: high

  # Rust port. Independent of the `test` job above so neither language's build
  # can spuriously block the other during the transition.
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Differential gate: every probe marked `required` in parity.toml must produce
  # identical output from both implementations.
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.5' }
      - run: cargo xtask parity
