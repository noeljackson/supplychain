name: reusable-supplychain-scan

on:
  workflow_call:
    inputs:
      policy:
        description: auto or strict
        required: false
        type: string
        default: strict
      minimum-release-age-days:
        description: Minimum npm package publication age for Bun lockfiles
        required: false
        type: number
        default: 7
      baseline:
        description: Reviewed Bun baseline path
        required: false
        type: string
        default: .supplychain/bun-baseline.json
      gitleaks-config:
        description: Explicit reviewed Gitleaks config path inside the scan target
        required: false
        type: string
        default: ""
      source-policy:
        description: Tracked source advisory policy path inside the scan target
        required: false
        type: string
        default: ""
      maintainer-baseline:
        description: Deterministic tracked maintainer baseline path
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository under inspection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Check out the exact called-workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The github context belongs to the caller of a reusable workflow.
          # Job-level metadata identifies this workflow's immutable source.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .supplychain-action
          persist-credentials: false
      - name: Run supplychain
        uses: ./.supplychain-action
        with:
          path: .
          policy: ${{ inputs.policy }}
          minimum-release-age-days: ${{ inputs.minimum-release-age-days }}
          baseline: ${{ inputs.baseline }}
          gitleaks-config: ${{ inputs.gitleaks-config }}
          source-policy: ${{ inputs.source-policy }}
          maintainer-baseline: ${{ inputs.maintainer-baseline }}
