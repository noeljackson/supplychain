name: reusable-supplychain-scan

on:
  workflow_call:
    inputs:
      policy:
        description: auto or strict
        required: false
        type: string
        default: strict
      minimum-release-age-days:
        description: Minimum npm package publication age for Bun lockfiles
        required: false
        type: number
        default: 7
      baseline:
        description: Reviewed Bun baseline path
        required: false
        type: string
        default: .supplychain/bun-baseline.json
      gitleaks-config:
        description: Explicit reviewed Gitleaks config path inside the scan target
        required: false
        type: string
        default: ""
      source-policy:
        description: Tracked source advisory policy path inside the scan target
        required: false
        type: string
        default: ""
      maintainer-baseline:
        description: Deterministic tracked maintainer baseline path
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository under inspection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Check out the pinned action source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Both values must stay literal. Inside a reusable workflow the github
          # context describes the caller, and no context exposes this workflow's
          # own source — job.workflow_repository and job.workflow_sha do not
          # exist, so they resolved to the empty string and silently checked out
          # the caller's repository, which the next step then executed.
          # scripts/check_release_security.py enforces the literal pin.
          repository: noeljackson/supplychain
          ref: 45ee609548f29cb8cdae432e4f5fd07ea9a4b8a6
          path: .supplychain-action
          persist-credentials: false
      - name: Run supplychain
        uses: ./.supplychain-action
        with:
          path: .
          policy: ${{ inputs.policy }}
          minimum-release-age-days: ${{ inputs.minimum-release-age-days }}
          baseline: ${{ inputs.baseline }}
          gitleaks-config: ${{ inputs.gitleaks-config }}
          source-policy: ${{ inputs.source-policy }}
          maintainer-baseline: ${{ inputs.maintainer-baseline }}
