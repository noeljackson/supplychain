name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to smoke test
        required: true
        type: string

permissions: {}

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - run: go mod verify
      - name: Install pinned Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify release evidence exists
        run: |
          test -s dist/checksums.txt
          compgen -G 'dist/*.tar.gz' > /dev/null
          compgen -G 'dist/*.sbom.*' > /dev/null
      - name: Attest release archives, checksums, and SBOMs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/*.sbom.*

  smoke:
    needs: goreleaser
    if: >-
      ${{
        always() &&
        (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Brew install released version
        run: |
          brew tap noeljackson/tap
          brew trust --cask noeljackson/tap/supplychain
          brew install --cask supplychain
      - name: Verify released version and health
        env:
          EXPECTED_TAG: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              inputs.release_tag ||
              github.ref_name
            }}
        run: |
          output=$(supplychain version)
          printf '%s\n' "$output"
          grep -F "$EXPECTED_TAG" <<<"$output"
          supplychain doctor
