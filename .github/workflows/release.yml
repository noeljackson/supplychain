name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to smoke test
        required: true
        type: string

permissions: {}

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - run: go mod verify
      - name: Install pinned Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.49.0
      # goreleaser uploads the release assets and then pushes the Homebrew cask.
      # A failure in that last step used to abort the job, leaving a published,
      # immutable release with no provenance attestation — which is how v0.1.5
      # shipped unattested. Tolerate a non-zero exit here and let the checks
      # below decide whether the release is actually sound.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        id: goreleaser
        continue-on-error: true
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Verify release evidence exists
        if: ${{ !cancelled() }}
        run: |
          test -s dist/checksums.txt
          compgen -G 'dist/*.tar.gz' > /dev/null
          compgen -G 'dist/*.sbom.*' > /dev/null
      - name: Verify every built artifact reached the release
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.sbom.*' -o -name 'checksums.txt' \) | wc -l)"
          actual="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')"
          echo "built $expected artifacts, release carries $actual"
          [ "$actual" -ge "$expected" ]
      - name: Attest release archives, checksums, and SBOMs
        if: ${{ !cancelled() }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/*.sbom.*
      - name: Report a publish side-effect that did not block the release
        if: ${{ !cancelled() && steps.goreleaser.outcome == 'failure' }}
        run: |
          echo "::warning title=Homebrew cask not updated::goreleaser exited non-zero after the
          release, its assets and its attestations were all verified complete. The most likely
          cause is the Homebrew tap push, so the tap may still point at the previous version."

  smoke:
    needs: goreleaser
    if: >-
      ${{
        always() &&
        (needs.goreleaser.result == 'success' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Brew install released version
        run: |
          brew tap noeljackson/tap
          brew trust --cask noeljackson/tap/supplychain
          brew install --cask supplychain
      - name: Verify released version and health
        env:
          EXPECTED_TAG: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              inputs.release_tag ||
              github.ref_name
            }}
        run: |
          output=$(supplychain version)
          printf '%s\n' "$output"
          grep -F "$EXPECTED_TAG" <<<"$output"
          supplychain doctor
