name: Supplychain Scan
description: Fail-closed dependency and repository supply-chain scan without executing project code
author: noeljackson

inputs:
  path:
    description: Repository path to scan
    required: false
    default: .
  policy:
    description: auto or strict
    required: false
    default: strict
  minimum-release-age-days:
    description: Minimum npm package publication age for Bun lockfiles
    required: false
    default: "7"
  baseline:
    description: Reviewed Bun baseline path relative to the repository
    required: false
    default: .supplychain/bun-baseline.json
  gitleaks-config:
    description: Explicit reviewed Gitleaks config path inside the scan target
    required: false
    default: ""
  source-policy:
    description: Tracked source advisory policy path inside the scan target
    required: false
    default: ""
  maintainer-baseline:
    description: Deterministic tracked maintainer baseline path inside the scan target
    required: false
    default: ""
  refresh-osm:
    description: Refresh OSM malware intelligence before scanning
    required: false
    default: "false"
  osm-token-file:
    description: Owner-only regular file containing the OSM bearer token
    required: false
    default: ""
  scan-source:
    description: Run repository, dependency, OSV, Bun, Gitleaks, and zizmor checks
    required: false
    default: "true"
  image:
    description: Optional local or registry OCI image to inventory and scan
    required: false
    default: ""
  fail-on-severity:
    description: Minimum Grype severity that fails an image scan
    required: false
    default: high
  only-fixed:
    description: Only fail image vulnerabilities for which a fix exists
    required: false
    default: "false"
  vex:
    description: Explicit reviewed OpenVEX document inside the checked-out repository
    required: false
    default: ""

outputs:
  sbom:
    description: Path to the generated SPDX JSON SBOM when image is set
    value: ${{ steps.image.outputs.sbom }}

runs:
  using: composite
  steps:
    - name: Set up pinned Go toolchain
      shell: bash
      run: bash "${{ github.action_path }}/scripts/setup-go"
    - name: Build pinned scanner source
      shell: bash
      env:
        GOTOOLCHAIN: local
        GOPROXY: https://proxy.golang.org
        GOSUMDB: sum.golang.org
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        go mod verify
        go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/supplychain-action" ./
    - name: Install pinned advisory tools
      shell: bash
      env:
        SUPPLYCHAIN_BIN_DIR: ${{ runner.temp }}/supplychain-bin
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SCAN_SOURCE: ${{ inputs.scan-source }}
      run: |
        set -euo pipefail
        args=()
        case "$INPUT_SCAN_SOURCE" in
          true) args+=(--source-tools) ;;
          false) ;;
          *) echo "scan-source must be true or false" >&2; exit 2 ;;
        esac
        if [ -n "$INPUT_IMAGE" ]; then
          args+=(--image-tools)
        fi
        if [ "${#args[@]}" -eq 0 ]; then
          echo "at least one of scan-source or image must be enabled" >&2
          exit 2
        fi
        "${{ github.action_path }}/scripts/install-ci-tools" "${args[@]}"
    - name: Scan repository without executing it
      if: inputs.scan-source == 'true'
      shell: bash
      env:
        SUPPLYCHAIN_DATA_DIR: ${{ runner.temp }}/supplychain-data
        INPUT_PATH: ${{ inputs.path }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_MINIMUM_AGE: ${{ inputs.minimum-release-age-days }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_GITLEAKS_CONFIG: ${{ inputs.gitleaks-config }}
        INPUT_SOURCE_POLICY: ${{ inputs.source-policy }}
        INPUT_MAINTAINER_BASELINE: ${{ inputs.maintainer-baseline }}
        INPUT_REFRESH_OSM: ${{ inputs.refresh-osm }}
        INPUT_OSM_TOKEN_FILE: ${{ inputs.osm-token-file }}
        SUPPLYCHAIN_BIN_DIR: ${{ runner.temp }}/supplychain-bin
      run: |
        set -euo pipefail
        config_args=()
        if [ -n "$INPUT_GITLEAKS_CONFIG" ]; then
          config_args+=(--gitleaks-config="$INPUT_GITLEAKS_CONFIG")
        fi
        policy_args=()
        if [ -n "$INPUT_SOURCE_POLICY" ]; then
          policy_args+=(--source-policy="$INPUT_SOURCE_POLICY")
        fi
        if [ -n "$INPUT_MAINTAINER_BASELINE" ]; then
          policy_args+=(--maintainer-baseline="$INPUT_MAINTAINER_BASELINE")
        fi
        refresh_args=()
        case "$INPUT_REFRESH_OSM" in
          true)
            refresh_args+=(--refresh-osm)
            if [ -n "$INPUT_OSM_TOKEN_FILE" ]; then
              refresh_args+=(--osm-token-file="$INPUT_OSM_TOKEN_FILE")
            fi
            ;;
          false) ;;
          *) echo "refresh-osm must be true or false" >&2; exit 2 ;;
        esac
        "$RUNNER_TEMP/supplychain-action" ci \
          --policy="$INPUT_POLICY" \
          --minimum-age-days="$INPUT_MINIMUM_AGE" \
          --baseline="$INPUT_BASELINE" \
          "${config_args[@]}" \
          "${policy_args[@]}" \
          "${refresh_args[@]}" \
          "$INPUT_PATH"
    - name: Inventory and scan OCI image
      id: image
      if: inputs.image != ''
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_FAIL_ON: ${{ inputs.fail-on-severity }}
        INPUT_ONLY_FIXED: ${{ inputs.only-fixed }}
        INPUT_VEX: ${{ inputs.vex }}
        SUPPLYCHAIN_BIN_DIR: ${{ runner.temp }}/supplychain-bin
      run: |
        set -euo pipefail
        case "$INPUT_ONLY_FIXED" in
          true) only_fixed=(--only-fixed) ;;
          false) only_fixed=() ;;
          *) echo "only-fixed must be true or false" >&2; exit 2 ;;
        esac
        sbom="$RUNNER_TEMP/supplychain.spdx.json"
        vex=()
        if [ -n "$INPUT_VEX" ]; then
          vex=(--vex="$INPUT_VEX")
        fi
        "$RUNNER_TEMP/supplychain-action" image \
          --sbom="$sbom" \
          --fail-on="$INPUT_FAIL_ON" \
          "${only_fixed[@]}" \
          "${vex[@]}" \
          "$INPUT_IMAGE"
        echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

branding:
  icon: shield
  color: purple
