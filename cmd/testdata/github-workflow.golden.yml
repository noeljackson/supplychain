# SECURITY: protect this file, .github/CODEOWNERS, .supplychain/**,
# and any reviewed Gitleaks/Bun policy with independent security ownership.
# Require code-owner review and dismiss stale approvals for changes to them.
name: supplychain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supplychain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: noeljackson/supplychain/.github/workflows/scan.yml@0123456789abcdef0123456789abcdef01234567
    with:
      policy: strict
